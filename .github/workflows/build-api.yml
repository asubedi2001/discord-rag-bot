name: Build Bot API Image

on:
  push:
    branches: ['main']
    paths:
      - 'bot-api/**' # ONLY runs when files in this folder change

env:
  REGISTRY: ghcr.io
  # Appends "-ragapi" to the repository name to make a unique package
  IMAGE_NAME: ${{ github.repository }}-ragapi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/build-push-action@v6
        with:
          context: ./bot-api  # Tell Docker to build from this folder
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
